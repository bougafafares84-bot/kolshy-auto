<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kolshy - كلشي</title><style>body{font-family:system-ui;background:#f0f2f5;margin:0;padding:15px}.card{background:#fff;padding:20px;border-radius:20px;max-width:500px;margin:auto;box-shadow:0 4px 20px #0001}input,button{width:100%;padding:14px;margin:8px 0;border-radius:12px;border:1px solid #ddd;box-sizing:border-box;font-size:15px}button{background:#6d28d9;color:#fff;border:0;font-weight:bold;font-size:17px} #payBox{display:none;background:#f5f3ff;padding:15px;border-radius:15px;border:2px solid #6d28d9;margin-top:15px;text-align:center}.annonce{background:#fff;padding:12px;border-radius:12px;margin:10px auto;max-width:500px;border-right:5px solid #6d28d9}.qr{width:180px;margin:10px auto;display:block;border-radius:10px}</style></head><body><div class="card"><h2>🚀 انشر إعلانك - 500 دج</h2><input id="t" placeholder="ماذا تبيع؟ مثلا Golf 7"><input id="p" placeholder="السعر"><input id="ph" placeholder="رقم هاتفك"><button onclick="showPay()">ادفع وانشر - 500 دج</button><div id="payBox"><h3 style="color:#6d28d9">ادفع 500 دج عبر Chargily</h3><p>حول لـ <b>@u7629045</b></p><img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://chargily.com/@u7629045" class="qr"><input id="tr" placeholder="رقم العملية بعد الدفع"><button onclick="publish()" style="background:#16a34a">تأكيد الدفع والنشر ✅</button></div></div><div id="list"></div><script>let annonces=JSON.parse(localStorage.getItem('kolshy2')||'[]');function render(){document.getElementById('list').innerHTML=annonces.map(a=>`<div class=annonce><b>${a.t}</b><br>💰 ${a.p}<br>📞 ${a.ph}<br><small>✅ مدفوع 500 دج - ${a.tr}</small></div>`).join('');}render();function showPay(){if(!t.value||!p.value||!ph.value)return alert('عمر كل المعلومات');payBox.style.display='block';}function publish(){if(!tr.value)return alert('حط رقم العملية');annonces.unshift({t:t.value,p:p.value,ph:ph.value,tr:tr.value});localStorage.setItem('kolshy2',JSON.stringify(annonces));alert('تم! 500 دج دخلت لحسابك @u7629045');payBox.style.display='none';t.value=p.value=ph.value=tr.value='';render();}</script></body></html>
