<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>50k منتج - نسخ برابط واحد</title>
<style>
body{font-family:Arial;max-width:700px;margin:auto;padding:15px;background:#f5f5f5}
.box{background:#fff;padding:15px;border-radius:15px;margin:10px 0;box-shadow:0 2px 8px #0001}
textarea{width:100%;height:200px;border-radius:12px;padding:12px;border:1px solid #ccc;box-sizing:border-box}
.btn{width:100%;padding:16px;border:0;border-radius:14px;font-weight:bold;font-size:18px;cursor:pointer;margin:6px 0}
.purple{background:#7c3aed;color:#fff}
.black{background:#000;color:#fff}
.green{background:#22c55e;color:#fff}
#list{max-height:400px;overflow:auto;background:#fff;border-radius:12px;padding:10px}
.item{padding:8px;border-bottom:1px solid #eee;font-size:14px}
.count{font-weight:bold;color:#7c3aed}
</style>
</head>
<body>
<div class="box">
<h2>📦 حط 50 ألف منتج هنا</h2>
<textarea id="input" placeholder="الصق هنا 50 الف منتج..."></textarea>
<button class="btn purple" onclick="generate()">⚡ ولّد الصفحة - 50k</button>
<p>العدد: <span id="cnt" class="count">0</span> منتج</p>
</div>
<div class="box" id="resultBox" style="display:none">
<h3>✅ وجدت <span id="total"></span> منتج</h3>
<button class="btn black" onclick="copyAll()">📋 نسخ كل المنتجات مرة وحدة</button>
<button class="btn green" onclick="shareLink()">🔗 نسخ رابط الصفحة</button>
<div id="list"></div>
</div>
<script>
let allProducts=[];
document.getElementById('input').addEventListener('input', e=>{
  let lines=e.target.value.split('\n').filter(x=>x.trim()!='');
  document.getElementById('cnt').innerText=lines.length;
});
function generate(){
  let txt=document.getElementById('input').value.trim();
  if(!txt) return alert('الصق المنتجات أولا');
  allProducts=txt.split('\n').filter(x=>x.trim()!='');
  document.getElementById('total').innerText=allProducts.length;
  document.getElementById('resultBox').style.display='block';
  let listDiv=document.getElementById('list');
  listDiv.innerHTML='';
  let show=allProducts.slice(0,500);
  show.forEach((p,i)=>{
    let d=document.createElement('div');d.className='item';d.textContent=(i+1)+'. '+p;listDiv.appendChild(d);
  });
  if(allProducts.length>500){listDiv.innerHTML+=`<div class="item">... و ${allProducts.length-500} منتج آخر مخفي، بصح يتنسخ كامل</div>`;}
  localStorage.setItem('kolshy_50k',txt);
}
function copyAll(){
  if(allProducts.length==0) return;
  navigator.clipboard.writeText(allProducts.join('\n')).then(()=>{alert('✅ تم نسخ '+allProducts.length+' منتج!');});
}
function shareLink(){navigator.clipboard.writeText(window.location.href);alert('✅ تم نسخ الرابط');}
</script>
</body>
</html>
