<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kolshy</title><style>body{font-family:system-ui;background:#f0f2f5;padding:15px;margin:0}.card{background:#fff;padding:20px;border-radius:20px;max-width:500px;margin:auto;text-align:center}input,button,a.btn{width:100%;padding:14px;margin:8px 0;border-radius:12px;border:1px solid #ddd;box-sizing:border-box;font-size:16px;display:block;text-decoration:none}button,a.btn{background:#6d28d9;color:#fff;border:0;font-weight:bold}.annonce{background:#fff;padding:12px;border-radius:12px;margin:10px auto;max-width:500px;border-right:5px solid #16a34a;text-align:right}</style></head><body><div class="card"><h2>🚀 انشر إعلانك - 500 دج</h2><input id="t" placeholder="واش تبيع؟"><input id="p" placeholder="السعر"><input id="ph" placeholder="رقمك"><a id="payLink" href="https://chargily.com/@u7629045" target="_blank" class="btn" onclick="ready()">💳 ادفع 500 دج - اضغط هنا</a><div id="after" style="display:none"><p style="color:green">✅ بعد ما تخلص ارجع واضغط</p><button onclick="publish()" style="background:#16a34a">تم الدفع - انشر إعلاني ✅</button></div></div><div id="list"></div><script>let a=JSON.parse(localStorage.getItem('k')||'[]');let render=()=>list.innerHTML=a.map(x=>`<div class=annonce><b>${x.t}</b><br>💰 ${x.p}<br>📞 ${x.ph}</div>`).join('');render();function ready(){after.style.display='block';payLink.innerHTML='⏳ استنى... خلصت؟ ارجع';}function publish(){if(!t.value||!p.value||!ph.value)return alert('عمر المعلومات');a.unshift({t:t.value,p:p.value,ph:ph.value});localStorage.setItem('k',JSON.stringify(a));alert('تم النشر! 500 دج راحت لـ @u7629045');t.value=p.value=ph.value='';after.style.display='none';payLink.innerHTML='💳 ادفع 500 دج - اضغط هنا';render();}</script></body></html>
