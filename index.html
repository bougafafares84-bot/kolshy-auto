<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kolshy Auto</title><style>body{font-family:system-ui;background:#f0f2f5;padding:15px;margin:0}.card{background:#fff;padding:20px;border-radius:20px;max-width:500px;margin:auto;text-align:center}input,button,a.btn{width:100%;padding:14px;margin:8px 0;border-radius:12px;border:1px solid #ddd;box-sizing:border-box;font-size:16px;display:block;text-decoration:none}button,a.btn{background:#6d28d9;color:#fff;border:0;font-weight:bold;cursor:pointer}.annonce{background:#fff;padding:12px;border-radius:12px;margin:10px auto;max-width:500px;border-right:5px solid #16a34a;text-align:right}</style></head><body><div class="card"><h2>🚀 انشر إعلانك - 500 دج</h2><input id="t" placeholder="واش تبيع؟"><input id="p" placeholder="السعر"><input id="ph" placeholder="رقم هاتفك"><a href="https://pay.chargily.dz/@u7629045" target="_blank" class="btn">💳 ادفع 500 دج - اضغط هنا</a><div style="margin-top:10px"><button onclick="publish()" style="background:#16a34a">تم الدفع - انشر إعلاني الآن ✅</button></div></div><div id="list"></div><script>let a=JSON.parse(localStorage.getItem('k')||'[]');let render=()=>list.innerHTML=a.map(x=>`<div class=annonce><b>${x.t}</b><br>💰 ${x.p}<br>📞 ${x.ph}</div>`).join('');render();function publish(){if(!t.value||!p.value||!ph.value)return alert('عمر المعلومات كامل');a.unshift({t:t.value,p:p.value,ph:ph.value});localStorage.setItem('k',JSON.stringify(a));alert('تم النشر!');t.value=p.value=ph.value='';render();}</script></body></html>
