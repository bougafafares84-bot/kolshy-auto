<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kolshy Auto</title><style>body{font-family:system-ui;background:#f0f2f5;padding:15px;margin:0}.card{background:#fff;padding:20px;border-radius:20px;max-width:500px;margin:auto;text-align:center}input,button{width:100%;padding:14px;margin:8px 0;border-radius:12px;border:1px solid #ddd;box-sizing:border-box;font-size:16px}button{background:#6d28d9;color:#fff;border:0;font-weight:bold;cursor:pointer}.copy-box{background:#6d28d9;color:#fff;padding:15px;border-radius:15px;margin:15px 0;cursor:pointer;font-size:20px;font-weight:bold;direction:ltr}.info{background:#dcfce7;padding:12px;border-radius:12px;font-size:14px;text-align:right}.annonce{background:#fff;padding:12px;border-radius:12px;margin:10px auto;max-width:500px;border-right:5px solid #16a34a;text-align:right}</style></head><body><div class="card"><h2>🚀 انشر إعلانك - 500 دج</h2><input id="t" placeholder="واش تبيع؟"><input id="p" placeholder="السعر"><input id="ph" placeholder="رقم هاتفك"><div class="info">💳 <b>طريقة الدفع:</b><br>1- افتح تطبيق <b>Chargily</b><br>2- اضغط <b>بحث</b> واكتب:<br></div><div class="copy-box" onclick="navigator.clipboard.writeText('@u7629045');alert('تم النسخ @u7629045')">@u7629045 📋 اضغط للنسخ</div><div class="info">3- ابعث <b>500 دج</b><br>4- ارجع هنا واضغط تم الدفع</div><button onclick="publish()" style="background:#16a34a;margin-top:15px">✅ تم الدفع - انشر إعلاني الآن</button></div><div id="list"></div><script>let a=JSON.parse(localStorage.getItem('k')||'[]');let render=()=>list.innerHTML=a.map(x=>`<div class=annonce><b>${x.t}</b><br>💰 ${x.p}<br>📞 ${x.ph}</div>`).join('');render();function publish(){if(!t.value||!p.value||!ph.value)return alert('عمر المعلومات كامل');a.unshift({t:t.value,p:p.value,ph:ph.value});localStorage.setItem('k',JSON.stringify(a));alert('تم النشر!');t.value=p.value=ph.value='';render();}</script></body></html>
