<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
 <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3925540157821985" crossorigin="anonymous"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KOLSHY - متجر 50 ألف منتج | ربح تلقائي</title>
<style>
body{font-family:Arial;background:#f8f9fa;margin:0}
header{background:#000;color:#fff;padding:15px;text-align:center;position:sticky;top:0;z-index:10}
.search{max-width:700px;margin:20px auto;display:flex;gap:8px;padding:0 15px}
.search input{flex:1;padding:16px;border-radius:12px;border:1px solid #ddd;font-size:17px}
.search button{padding:16px 25px;background:#ff4747;color:#fff;border:none;border-radius:12px;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:15px;max-width:1100px;margin:auto}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px #0001;text-decoration:none;color:#000}
.card img{width:100%;height:160px;object-fit:cover}
.card div{padding:10px}
.price{color:#ff4747;font-weight:bold;font-size:18px}
.note{background:#fff3cd;padding:12px;text-align:center;margin:10px;border-radius:10px}
</style>
</head>
<body>
<header>
<h2 style="margin:0">🛒 KOLSHY - كلشي بثمن رخيص</h2>
<p style="margin:5px 0 0;font-size:13px;opacity:.8">اطلب من AliExpress - التوصيل للجزائر - أنت تربح كوميسيون</p>
</header>

<div class="note">🔥 اكتب وش تحب تشري والمتجر يجيبلك 50 ألف منتج من AliExpress</div>

<div class="search">
<input id="q" placeholder="ماذا تريد؟ مثلا: ساعة ذكية، سماعات، حذاء...">
<button onclick="search()">بحث</button>
</div>

<div class="grid" id="grid"></div>

<script>
// هذا رابط الأفلييت تاعك - بدلو برقمك لما تجيب واحد
const AFF = "https://s.click.aliexpress.com/e/_YOUR_AFFILIATE_ID";

const products = [
{name:"ساعة ذكية T800",price:"2500 دج",img:"https://via.placeholder.com/300x300?text=Watch"},
{name:"سماعات بلوتوث",price:"1800 دج",img:"https://via.placeholder.com/300x300?text=Earbuds"},
{name:"حذاء رياضي",price:"4500 دج",img:"https://via.placeholder.com/300x300?text=Shoes"},
{name:"حقيبة ظهر",price:"3200 دج",img:"https://via.placeholder.com/300x300?text=Bag"},
{name:"شاحن سريع",price:"1200 دج",img:"https://via.placeholder.com/300x300?text=Charger"},
{name:"كاميرا صغيرة",price:"6000 دج",img:"https://via.placeholder.com/300x300?text=Camera"},
];

function render(list){
 document.getElementById('grid').innerHTML = list.map(p=>`
 <a class="card" href="${AFF}" target="_blank">
 <img src="${p.img}"><div><div>${p.name}</div><div class="price">${p.price}</div></div>
 </a>`).join('');
}

function search(){
 let qq = document.getElementById('q').value;
 if(!qq) return;
 // يبحث مباشرة في علي اكسبرس برابط الأفلييت تاعك
 window.open(`https://s.click.aliexpress.com/e/_YOUR_AFFILIATE_ID?search=${encodeURIComponent(qq)}`,'_blank');
}

render(products);
</script>
</body>
</html>
